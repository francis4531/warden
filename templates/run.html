{% extends "base.html" %}
{% block title %}Conversation · Warden{% endblock %}
{% block body %}
<style>
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes fadein{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
#chat>*{animation:fadein .22s ease}
.livedot{width:8px;height:8px;border-radius:50%;background:var(--brass-b);display:inline-block;animation:pulse 1s infinite}
.msg{max-width:82%;padding:12px 16px;border-radius:13px;margin:12px 0;font-size:14px;line-height:1.6}
.msg .who{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-bottom:5px}
.msg.user{margin-left:auto;background:var(--ink3);border:1px solid var(--line2)}
.msg.agent{background:var(--ink2);border:1px solid var(--line);border-left:2px solid var(--brass)}
.msg.err{border-left-color:var(--high);color:var(--high)}
.chip{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11.5px;color:var(--mut);background:var(--ink2);border:1px solid var(--line);border-radius:20px;padding:5px 12px;margin:4px 6px 4px 0;max-width:100%}
.chip .r{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:520px}
.activity{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:12px;color:var(--brass-b);margin:8px 0}
.composer{position:sticky;bottom:0;background:linear-gradient(transparent,var(--ink) 22%);padding:18px 0 4px;margin-top:10px}
.composer .box{display:flex;gap:10px;align-items:flex-end;background:var(--ink2);border:1px solid var(--line2);border-radius:12px;padding:10px 12px}
.composer input{flex:1;background:transparent;border:none;color:var(--txt);font-family:var(--body);font-size:14px;padding:6px 4px}
.composer input:focus{outline:none}
.composer .hint{font-family:var(--mono);font-size:11px;color:var(--dim);margin:8px 2px 0}
</style>

<div class="page-h" style="margin-bottom:12px">
  <div class="eyebrow">Conversation &middot; {{ agent.name }}</div>
  <div style="display:flex;align-items:center;gap:10px;margin-top:4px">
    <span id="statuspill" class="pill {{ run.status }}">{{ run.status.replace('_',' ') }}</span>
    <span style="color:var(--dim);font-family:var(--mono);font-size:11.5px">{{ run.id }}</span>
    <a style="color:var(--dim);font-size:12px;margin-left:auto" href="{{ url_for('agent', aid=agent.id) }}">&larr; {{ agent.name }}</a>
  </div>
</div>

<div id="chat"></div>
<div id="gate"></div>
<div id="activity" class="activity" style="display:none"><span class="livedot"></span><span id="activitytext">working&hellip;</span></div>

<div class="composer">
  <form id="composer" onsubmit="return false">
    <div class="box">
      <input id="msg" type="text" autocomplete="off" placeholder="Reply to the agent&hellip;">
      <button id="sendbtn" class="btn brass sm" type="submit">Send</button>
    </div>
    <div class="hint" id="hint"></div>
  </form>
</div>

<script>
const RID = {{ run.id|tojson }};
const KC = {approval_request:'k-approval_request',approved:'k-approved',denied:'k-denied',final:'k-final',tool_result_gated:'k-tool_result_gated'};
function esc(s){return (s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function stamp(r){return r?`<span class="stamp ${r}">${r}</span>`:'';}

function renderChat(events){
  let html='', chips='';
  const flush=()=>{ if(chips){ html+=`<div>${chips}</div>`; chips=''; } };
  for(const e of events){
    if(e.kind==='run_started' || e.kind==='user_message'){
      flush(); html+=`<div class="msg user"><div class="who">you</div>${esc(e.text)}</div>`;
    } else if(e.kind==='final'){
      flush(); html+=`<div class="msg agent"><div class="who">${'{{ agent.name }}'}</div>${esc(e.text)}</div>`;
    } else if(e.kind==='error'){
      flush(); html+=`<div class="msg agent err"><div class="who">error</div>${esc(e.text)}</div>`;
    } else if(e.kind==='tool_result' || e.kind==='tool_result_gated'){
      chips+=`<span class="chip">used <b style="color:var(--txt)">${esc(e.tool)}</b> ${stamp(e.risk)}<span class="r">${esc(e.text)}</span></span>`;
    } else if(e.kind==='denied'){
      chips+=`<span class="chip">${esc(e.tool)} ${stamp(e.risk)} <span style="color:var(--high)">denied</span></span>`;
    }
  }
  flush();
  return html || '<div style="color:var(--dim);font-family:var(--mono);font-size:12px;padding:8px 0">Say something to start the conversation.</div>';
}
function renderGate(pending, back){
  return pending.map(a=>`
    <div class="gate">
      <div class="g-eye"><span>&#9209; approval required</span> ${stamp(a.risk)}</div>
      <div class="g-title">The agent wants to run <span style="font-family:var(--mono)">${esc(a.tool)}</span></div>
      <div style="color:var(--mut);font-size:13px">This changes state and is held until you approve. Nothing has happened yet.</div>
      <div class="g-args">${esc(JSON.stringify(a.input,null,2))}</div>
      <div class="g-actions">
        <button class="btn brass" onclick="decide('${a.approve}','approved')">Approve &amp; run</button>
        <button class="btn deny" onclick="decide('${a.approve}','denied')">Deny</button>
      </div>
    </div>`).join('');
}
async function decide(url, decision){
  await fetch(url,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded','X-Requested-With':'fetch'},body:'decision='+decision});
  poll();
}
async function send(){
  const inp=document.getElementById('msg'); const text=inp.value.trim(); if(!text) return;
  inp.value='';
  await fetch(`/run/${RID}/say`,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'input='+encodeURIComponent(text)});
  poll();
}
document.getElementById('composer').addEventListener('submit',send);

let atBottom=true;
window.addEventListener('scroll',()=>{atBottom=(window.innerHeight+window.scrollY)>=document.body.offsetHeight-80;});

async function poll(){
  let d; try{ d=await(await fetch(`/run/${RID}/events`)).json(); }catch(e){ setTimeout(poll,1500); return; }
  document.getElementById('chat').innerHTML=renderChat(d.events);
  document.getElementById('gate').innerHTML=renderGate(d.pending, d.back);
  const sp=document.getElementById('statuspill'); sp.className='pill '+d.status; sp.textContent=d.status.replace(/_/g,' ');
  const busy=(d.status==='running'||d.status==='awaiting_approval');
  const act=document.getElementById('activity');
  const last=d.events[d.events.length-1];
  act.style.display = d.status==='running' ? 'flex':'none';
  if(d.status==='running') document.getElementById('activitytext').textContent = last&&last.tool?('running '+last.tool+'\u2026'):'thinking\u2026';
  const inp=document.getElementById('msg'), btn=document.getElementById('sendbtn'), hint=document.getElementById('hint');
  inp.disabled=busy; btn.disabled=busy;
  hint.textContent = d.status==='awaiting_approval' ? 'Resolve the approval above to continue.' : (d.status==='running' ? 'Agent is working\u2026' : '');
  if(atBottom) window.scrollTo(0,document.body.scrollHeight);
  if(busy) setTimeout(poll, d.status==='running'?900:2500);
  else if(!inp.disabled){ inp.focus(); }
}
poll();
</script>
{% endblock %}
